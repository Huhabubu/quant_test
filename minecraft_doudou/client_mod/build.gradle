plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
neoForge {
    version = project.neo_version
    runs { client { client() } }
    mods {
        doudou_client { sourceSet(sourceSets.main) }
    }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

/** Verify pure daylight-time conversion without launching Minecraft. */
tasks.register('verifyWorldClock', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.doudou.client.WorldClockTest'
}
tasks.named('check') {
    dependsOn tasks.named('verifyWorldClock')
}

// WorldClockTest is a standalone Java main executed by verifyWorldClock,
// not a JUnit test. The default Gradle test task has no discoverable tests.
tasks.named('test', Test) {
    failOnNoDiscoveredTests = false
}
