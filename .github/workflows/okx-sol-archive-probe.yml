name: OKX SOL archive probe
on:
  pull_request:
    paths:
      - scripts/okx_sol_archive_probe.py
      - .github/workflows/okx-sol-archive-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check public OKX historical file listings and bounded byte ranges
        run: python scripts/okx_sol_archive_probe.py
