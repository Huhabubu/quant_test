name: CryptoHFTData Binance exchange timestamp precision audit

on:
  push:
    branches: [data-check/tardis-crosscheck]
    paths:
      - 'scripts/audit_chd_timestamps.py'
      - '.github/workflows/chd-timestamp-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy pyarrow
      - run: python -u scripts/audit_chd_timestamps.py
