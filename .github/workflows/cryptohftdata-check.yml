name: CryptoHFTData SOLUSDT verification

on:
  push:
    branches:
      - data-check/cryptohftdata-solusdt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pyarrow
      - name: Download and inspect one hour
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          import pyarrow.parquet as pq

          root = Path("outputs")
          root.mkdir(exist_ok=True)
          exchange, date, hour, symbol = "binance_futures", "2026-09-02", "12", "SOLUSDT"
          results = {}
          for kind in ("trades", "orderbook"):
              remote = f"{exchange}/{date}/{hour}/{symbol}_{kind}.parquet"
              url = "https://api.cryptohftdata.com/v1/download?" + urlencode({"file": remote})
              target = Path(f"{symbol}_{kind}.parquet")
              result = {"remote": remote}
              print(f"\n==== {remote} ====", flush=True)
              try:
                  with urlopen(Request(url, headers={"User-Agent": "quant-test-dataset-validation/1.0"}), timeout=90) as resp:
                      result.update(
                          http_status=resp.status,
                          content_type=resp.headers.get("Content-Type"),
                          content_length=resp.headers.get("Content-Length"),
                          final_url=resp.geturl(),
                      )
                      total = 0
                      with target.open("wb") as fout:
                          while True:
                              chunk = resp.read(1024 * 1024)
                              if not chunk:
                                  break
                              total += len(chunk)
                              if total > 650 * 1024 * 1024:
                                  raise ValueError("Stopped: file exceeds 650 MiB inspection limit")
                              fout.write(chunk)
                  result["download_bytes"] = target.stat().st_size
                  with target.open("rb") as f:
                      signature = f.read(4)
                  if signature != b"PAR1":
                      raise ValueError(f"Not Parquet; first bytes={signature!r}")
                  pf = pq.ParquetFile(target)
                  result["rows"] = pf.metadata.num_rows
                  result["row_groups"] = pf.metadata.num_row_groups
                  result["columns"] = pf.schema_arrow.names
                  if result["rows"] and result["row_groups"]:
                      first = pf.read_row_group(0)
                      last = pf.read_row_group(pf.metadata.num_row_groups - 1)
                      result["first_rows"] = first.slice(0, 3).to_pylist()
                      result["last_rows"] = last.slice(max(0, last.num_rows - 3), 3).to_pylist()
                      if kind == "orderbook":
                          from collections import Counter
                          counts = Counter()
                          event_count = 0
                          continuity_checks = 0
                          gap_count = 0
                          example_gaps = []
                          last_event_key = None
                          last_update_id = None
                          for rg in range(pf.metadata.num_row_groups):
                              data = pf.read_row_group(rg, columns=[
                                  "received_time", "event_type", "final_update_id",
                                  "prev_final_update_id"
                              ]).to_pydict()
                              for received, event_type, final_id, prev_id in zip(
                                  data["received_time"], data["event_type"],
                                  data["final_update_id"], data["prev_final_update_id"]
                              ):
                                  counts[event_type] += 1
                                  key = (received, event_type, final_id)
                                  if key == last_event_key:
                                      continue
                                  event_count += 1
                                  if event_type == "snapshot":
                                      last_update_id = None
                                  elif event_type == "update":
                                      if last_update_id is not None and prev_id is not None:
                                          continuity_checks += 1
                                          if prev_id != last_update_id:
                                              gap_count += 1
                                              if len(example_gaps) < 5:
                                                  example_gaps.append({
                                                      "timestamp": received,
                                                      "expected_prev_final_id": last_update_id,
                                                      "actual_prev_final_id": prev_id,
                                                  })
                                      last_update_id = final_id
                                  last_event_key = key
                          result["event_type_rows"] = dict(counts)
                          result["distinct_orderbook_events"] = event_count
                          result["continuity_checks"] = continuity_checks
                          result["continuity_gaps"] = gap_count
                          result["example_gaps"] = example_gaps
                      sample = first.slice(0, min(first.num_rows, 5000))
                      pq.write_table(sample, root / f"{symbol}_{kind}_head.parquet")
                  print(json.dumps(result, ensure_ascii=False, default=str, indent=2), flush=True)
              except (HTTPError, URLError, OSError, ValueError, KeyError) as e:
                  result["error"] = repr(e)
                  if isinstance(e, HTTPError):
                      try:
                          result["response_body"] = e.read(800).decode("utf-8", errors="replace")
                      except Exception:
                          pass
                  print(json.dumps(result, ensure_ascii=False, default=str, indent=2), flush=True)
              results[kind] = result
              target.unlink(missing_ok=True)
          (root / "report.json").write_text(json.dumps(results, indent=2, default=str), encoding="utf-8")
          if not all("rows" in item for item in results.values()):
              raise SystemExit("At least one dataset failed validation")
          PY
      - name: Find previous orderbook checkpoint
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          import pyarrow as pa
          import pyarrow.compute as pc
          import pyarrow.parquet as pq

          path = Path("outputs")
          scan = []
          for hour in range(11, -1, -1):
              source = f"binance_futures/2026-09-02/{hour:02d}/SOLUSDT_orderbook.parquet"
              url = "https://api.cryptohftdata.com/v1/download?" + urlencode({"file": source})
              target = Path("previous_hour.parquet")
              entry = {"hour": f"{hour:02d}", "source": source}
              try:
                  with urlopen(Request(url, headers={"User-Agent": "quant-test-dataset-validation/1.0"}), timeout=90) as resp:
                      with target.open("wb") as fp:
                          while chunk := resp.read(1024 * 1024):
                              fp.write(chunk)
                  pf = pq.ParquetFile(target)
                  entry["bytes"] = target.stat().st_size
                  entry["rows"] = pf.metadata.num_rows
                  snapshot_rows = 0
                  for rg in range(pf.metadata.num_row_groups):
                      types = pf.read_row_group(rg, columns=["event_type"]).column(0)
                      snapshot_rows += int(pc.sum(pc.cast(pc.equal(types, pa.scalar("snapshot")), pa.int64())).as_py() or 0)
                  entry["snapshot_rows"] = snapshot_rows
                  scan.append(entry)
                  print(json.dumps(entry), flush=True)
                  if snapshot_rows:
                      print("CHECKPOINT FOUND", flush=True)
                      break
              except Exception as exc:
                  entry["error"] = repr(exc)
                  scan.append(entry)
                  print(json.dumps(entry), flush=True)
              finally:
                  target.unlink(missing_ok=True)
          (path / "checkpoint_scan.json").write_text(
              json.dumps(scan, indent=2), encoding="utf-8"
          )
          PY
      - name: Replay SOLUSDT book from prior checkpoint
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          import pyarrow.parquet as pq

          book = {"bid": {}, "ask": {}}
          ready = False
          last_key = None
          prior_update_id = None
          gaps = []
          num_snapshots = 0
          num_events = 0
          num_levels = 0
          sampled_quotes = 0
          crossed_quotes = 0
          crossed_examples = []
          first_good_quote = None
          last_quote = None
          hours = []
          cols = ["received_time", "event_type", "final_update_id",
                  "prev_final_update_id", "last_update_id", "side", "price", "quantity"]
          for hour in range(7, 13):
              remote = f"binance_futures/2026-09-02/{hour:02d}/SOLUSDT_orderbook.parquet"
              url = "https://api.cryptohftdata.com/v1/download?" + urlencode({"file": remote})
              target = Path("book_hour.parquet")
              with urlopen(Request(url, headers={"User-Agent": "quant-test-dataset-validation/1.0"}), timeout=90) as resp:
                  with target.open("wb") as fp:
                      while chunk := resp.read(1024 * 1024):
                          fp.write(chunk)
              pf = pq.ParquetFile(target)
              hours.append({"hour": hour, "rows": pf.metadata.num_rows})
              for rg in range(pf.metadata.num_row_groups):
                  data = pf.read_row_group(rg, columns=cols).to_pydict()
                  for received, typ, final_id, prev_id, snap_id, side, price, qty in zip(
                      *(data[k] for k in cols)
                  ):
                      key = (received, typ, final_id, snap_id)
                      if key != last_key:
                          # Sampling only at event boundaries avoids partial-delta quotes.
                          if ready and num_events % 10000 == 0 and book["bid"] and book["ask"]:
                              best_bid = max(book["bid"])
                              best_ask = min(book["ask"])
                              quote = {
                                  "hour": hour, "received_time": received,
                                  "best_bid": best_bid, "best_ask": best_ask,
                                  "spread": round(best_ask - best_bid, 6)
                              }
                              first_good_quote = first_good_quote or quote
                              last_quote = quote
                              sampled_quotes += 1
                              if best_bid >= best_ask:
                                  crossed_quotes += 1
                                  if len(crossed_examples) < 5:
                                      crossed_examples.append(quote)
                          num_events += 1
                          if typ == "snapshot":
                              num_snapshots += 1
                              ready = True
                              book["bid"].clear()
                              book["ask"].clear()
                              prior_update_id = None
                          elif typ == "update":
                              if prior_update_id is not None and prev_id is not None:
                                  if prior_update_id != prev_id and len(gaps) < 20:
                                      gaps.append({
                                          "hour": hour, "received_time": received,
                                          "expected_prev_id": prior_update_id,
                                          "actual_prev_id": prev_id
                                      })
                              prior_update_id = final_id
                          last_key = key
                      if not ready or side not in book:
                          continue
                      num_levels += 1
                      px, quantity = float(price), float(qty)
                      if quantity == 0:
                          book[side].pop(px, None)
                      else:
                          book[side][px] = quantity
              target.unlink()
          if book["bid"] and book["ask"]:
              last_quote = {"best_bid": max(book["bid"]), "best_ask": min(book["ask"]),
                            "spread": round(min(book["ask"]) - max(book["bid"]), 6)}
          result = {
              "hours": hours, "snapshot_events": num_snapshots,
              "events_seen": num_events, "processed_levels_after_snapshot": num_levels,
              "continuity_gap_examples": gaps, "sampled_quotes": sampled_quotes,
              "crossed_quotes": crossed_quotes, "crossed_examples": crossed_examples,
              "first_sampled_quote": first_good_quote,
              "last_quote": last_quote,
          }
          print("REPLAY_RESULT " + json.dumps(result, ensure_ascii=False), flush=True)
          Path("outputs/replay_report.json").write_text(json.dumps(result, indent=2), encoding="utf-8")
          if not ready or crossed_quotes or gaps or not last_quote or last_quote["spread"] <= 0:
              raise SystemExit("Replay integrity checks failed")
          PY
      - name: Upload metadata and limited samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cryptohftdata-solusdt-one-hour-check
          path: outputs/
          if-no-files-found: warn
          retention-days: 7
