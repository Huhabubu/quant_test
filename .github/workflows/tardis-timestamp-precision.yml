name: Tardis Binance Futures timestamp resolution
on:
  push:
    branches: [data-check/tardis-time-resolution]
    paths:
      - 'scripts/tardis_timestamp_precision.py'
      - '.github/workflows/tardis-timestamp-precision.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Sample source CSV timestamp precision without downloading whole days
        run: python -u scripts/tardis_timestamp_precision.py
