name: CHD L2 reconnect context for missing Trades
on:
  push:
    branches: [data-check/chd-trade-gap-root-cause]
    paths:
      - 'scripts/chd_l2_outage_context.py'
      - '.github/workflows/chd-l2-outage-context.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pyarrow
      - run: python -u scripts/chd_l2_outage_context.py
