name: basis-monitor-sample

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/monitor.yml"

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Show runner clock
        run: |
          date -u
          timedatectl status || true

      - name: Run monitor for 5.5 hours
        shell: bash
        run: |
          set +e
          timeout --signal=INT --kill-after=30s 19800s python -u monitor.py 2>&1 | tee monitor.log
          rc=${PIPESTATUS[0]}
          echo "monitor_exit_code=$rc" | tee -a monitor.log
          if [ "$rc" -eq 0 ] || [ "$rc" -eq 124 ] || [ "$rc" -eq 130 ]; then
            exit 0
          fi
          exit "$rc"

      - name: Upload monitor data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: basis-monitor-data-${{ github.run_id }}
          path: |
            data/
            monitor.log
          if-no-files-found: warn
          retention-days: 14
