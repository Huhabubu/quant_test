name: CryptoHFTData storage sizing probe
on:
  push:
    branches:
      - data-check/cryptohftdata-storage-sizing
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Read file sizes without saving market data
        run: python -u scripts/cryptohftdata_size_probe.py
